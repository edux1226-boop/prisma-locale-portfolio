# Sito Vite multipagina: Netlify esegue la build e pubblica dist/.
# La Content-Security-Policy per pagina non è qui: la genera scripts/vite-csp.mjs in dist/_headers
# (contiene gli hash degli script inline, che cambiano se cambia lo script).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# JS e CSS hanno l'hash nel nome, font e immagini non cambiano: cache lunga.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Anteprime per i potenziali clienti: mai in indice, nemmeno se il link gira.
[[headers]]
  for = "/anteprime/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
