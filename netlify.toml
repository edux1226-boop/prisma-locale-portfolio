# Sito Vite multipagina: Netlify esegue la build e pubblica dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # 'unsafe-inline' serve agli script/stili inline delle pagine (tema, JSON-LD, stili a variabili CSS).
    # I CDN sono ammessi solo per l'anteprima Destino. Il modulo contatti invia a Google Apps Script.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'self' https://script.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# JS e CSS hanno l'hash nel nome, font e immagini non cambiano: cache lunga.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Anteprime per i potenziali clienti: mai in indice, nemmeno se il link gira.
[[headers]]
  for = "/anteprime/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
