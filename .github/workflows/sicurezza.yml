name: Sicurezza
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scansione segreti (storia completa)
        run: node scripts/scansione-segreti.mjs --storia
      - name: Dipendenze vulnerabili
        run: npm audit --audit-level=high
