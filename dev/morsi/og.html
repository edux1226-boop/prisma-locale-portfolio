<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Morsi, immagine social</title>
<style>
  @font-face { font-family: "Archivo Expanded"; src: url("@PUBLIC@/assets/fonts/archivo-expanded.woff2") format("woff2"); font-weight: 700 900; }
  @font-face { font-family: "Familjen Grotesk"; src: url("@PUBLIC@/assets/fonts/familjen-grotesk.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #fff; font-family: "Familjen Grotesk", sans-serif;
        background: radial-gradient(90% 120% at 25% 30%, #1c1bff 0%, #0504ff 45%, #05055e 100%); }
  .og::before { content: ""; position: absolute; inset: 0; opacity: .35;
        background-image: linear-gradient(rgb(255 255 255 / .12) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .12) 1px, transparent 1px); background-size: 42px 42px; }
  .logo { position: absolute; left: 64px; top: 120px; width: 520px; color: #fff; --logo-fondo: #1412ff;
          filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 16px #8686ff); }
  .logo svg { width: 100%; height: auto; display: block; overflow: visible; }
  .slogan { position: absolute; left: 64px; top: 340px; margin: 0; width: 600px; font: 800 38px/1.15 "Archivo Expanded", sans-serif; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 0 4px #fff, 0 0 18px #7e7eff; }
  .sedi { position: absolute; left: 64px; bottom: 56px; font: 700 22px/1 "Familjen Grotesk", sans-serif; letter-spacing: .16em; text-transform: uppercase; }
  .foto { position: absolute; right: 56px; top: 56px; width: 500px; height: 518px; transform: rotate(3deg); border-radius: 26px; overflow: hidden;
          -webkit-mask-image: radial-gradient(circle 54px at 100% 16%, #0000 98%, #000 100%), radial-gradient(circle 34px at 100% 40%, #0000 98%, #000 100%); -webkit-mask-composite: source-in; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag { position: absolute; right: 64px; bottom: 30px; padding: 8px 14px; border-radius: 10px; background: #FFB81C; color: #1B1F5C; font: 900 18px/1 "Archivo Expanded", sans-serif; text-transform: uppercase; transform: rotate(-3deg); }
</style>
</head>
<body>
<!-- Pagina di servizio per scripts/render-morsi-og.mjs: l'immagine per le anteprime social. -->
<div class="og">
  <div class="logo">@LOGO@</div>
  <p class="slogan">No fast food<br>ma quality food</p>
  <p class="sedi">Pineto · Roseto degli Abruzzi</p>
  <div class="foto"><img src="@PUBLIC@/assets/img/morsi/melt-l.webp" alt=""></div>
  <p class="tag">Anteprima · Prisma Locale</p>
</div>
</body>
</html>
