<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Biglietto da visita v4 (solo sviluppo)</title><style>
  @font-face { font-family: "Newsreader Display"; src: url("/assets/fonts/newsreader-display.woff2") format("woff2"); }
  @font-face { font-family: "Newsreader Display"; font-style: italic; src: url("/assets/fonts/newsreader-display-italic.woff2") format("woff2"); }
  @font-face { font-family: "Schibsted Grotesk"; src: url("/assets/fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; background: #777; }
  :root { --notte:#0A0F24; --crema:#EEEAE2; --grigio:#9AA0B4; --arancio:#FF5A28; }
  .card { position: relative; width: 1004px; height: 650px; overflow: hidden; background: var(--notte); color: var(--crema); font-family: "Schibsted Grotesk", sans-serif; }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .lockup svg { width: 52px; height: 74px; }
  .lockup span { font: 440 56px/1 "Newsreader Display", serif; letter-spacing: -.02em; }
  .lockup i { font-style: italic; }
  .ic { width: 34px; height: 34px; flex: none; }
  .rule { height: 1px; background: rgb(238 234 226 / .22); }
  .label { font-size: 17px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--grigio); }

  /* FRONTE */
  .front .lockup { position: absolute; left: 60px; top: 52px; }
  .front .beam { position: absolute; right: 0; top: 0; width: 470px; height: 330px; }
  .front .cta { position: absolute; left: 60px; top: 262px; }
  .front .cta .label { font-size: 20px; }
  .front .pill { margin-top: 20px; display: inline-flex; align-items: center; gap: 28px; padding: 18px 44px 20px 46px; border: 1.5px solid var(--crema); border-radius: 999px; font: italic 440 74px/1 "Newsreader Display", serif; letter-spacing: -.02em; }
  .front .pill svg { width: 40px; height: 40px; }
  .front .servizi { position: absolute; left: 60px; right: 60px; bottom: 50px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgb(238 234 226 / .22); padding-top: 30px; }
  .front .servizi div { display: flex; align-items: center; gap: 18px; padding-left: 28px; border-left: 1px solid rgb(238 234 226 / .22); }
  .front .servizi div:first-child { padding-left: 0; border-left: 0; }
  .front .servizi b { display: block; font-size: 20px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .front .servizi small { display: block; margin-top: 6px; font-size: 16px; letter-spacing: .08em; color: var(--grigio); text-transform: uppercase; }

  .front .rays { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bigmark { position: absolute; left: 70px; bottom: 150px; display: flex; align-items: flex-end; gap: 40px; }
  .bigmark svg { width: 130px; height: 187px; }
  .bigmark span { font: 440 126px/0.86 "Newsreader Display", serif; letter-spacing: -.03em; padding-bottom: 6px; }
  .bigmark i { font-style: italic; }

  .front .cosa { position: absolute; left: 74px; right: 60px; bottom: 64px; white-space: nowrap; font-size: 28px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--crema); }
  .front .cosa::before { content: ""; display: inline-block; width: 44px; height: 3px; margin-right: 22px; vertical-align: middle; background: var(--arancio); }

  /* RETRO */
  .back .side { position: absolute; left: 0; top: 0; bottom: 0; width: 340px; padding: 56px 44px 52px 60px; box-sizing: border-box; background: #0F1530; display: flex; flex-direction: column; }
  .back .side::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: linear-gradient(180deg,#FF5A48,#FF9F43 17%,#FFE066 33%,#6EE7A8 50%,#5CC8FF 66%,#6F7BFF 83%,#B07CFF); }
  .back .side .mark { width: 96px; height: 138px; }
  .back .side .motto { margin-top: 26px; font: 440 40px/1.05 "Newsreader Display", serif; letter-spacing: -.025em; }
  .back .side .motto i { font-style: italic; color: var(--arancio); }
  .back .qrbox { margin: auto 0; }
  .back .qrtile { width: 200px; height: 200px; padding: 16px; box-sizing: border-box; background: var(--crema); border-radius: 12px; }
  .back .qr { width: 100%; height: 100%; display: block; }
  .back .qrbox p { margin: 12px 0 0; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--grigio); }
  .back .main { position: absolute; left: 340px; right: 0; top: 0; bottom: 0; padding: 56px 60px 52px 62px; display: flex; flex-direction: column; }
  .back .who { font: 440 46px/1 "Newsreader Display", serif; letter-spacing: -.02em; }
  .back .who i { font-style: italic; }
  .back .slogan { margin-top: 12px; font: 440 36px/1.1 "Newsreader Display", serif; letter-spacing: -.02em; color: var(--crema); }
  .back .slogan i { font-style: italic; color: var(--arancio); }
  .back .role { margin-top: 10px; font-size: 20px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--grigio); }
  .back .rows { margin-top: auto; margin-bottom: auto; display: grid; }
  .back .row { display: flex; align-items: center; gap: 26px; padding: 15px 0; border-top: 1px solid rgb(238 234 226 / .18); font-size: 29px; font-weight: 500; }
  .back .row .ic { color: var(--arancio); }
  .back .row small { display: block; font-size: 15px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--grigio); margin-bottom: 3px; }
  .back .foot { white-space: nowrap; margin-top: auto; padding-top: 18px; border-top: 1px solid rgb(238 234 226 / .18); display: flex; justify-content: space-between; gap: 20px; font-size: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--crema); }
  .back .foot span:last-child { color: var(--grigio); }
</style></head><body>
