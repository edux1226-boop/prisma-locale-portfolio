<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Borgo Spoltino, immagine social</title>
<link rel="stylesheet" href="/src/anteprime/borgo/styles/tokens.css">
<style>
  html, body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #1E1A15; color: #F3EEE5; }
  .og img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
  .og::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 70% at 20% 80%, rgb(30 26 21 / .55), transparent 70%), linear-gradient(to top, rgb(30 26 21 / .6), transparent 55%); }
  .testo { position: absolute; left: 64px; bottom: 58px; z-index: 1; }
  .luogo { font: 600 13px/1 var(--f-testo); letter-spacing: .26em; text-transform: uppercase; opacity: .85; margin-bottom: 18px; }
  h1 { margin: 0; font: 400 128px/.86 var(--f-display); letter-spacing: -.025em; }
  h1 i { display: block; padding-left: .92em; }
  .firma { position: absolute; right: 56px; bottom: 58px; z-index: 1; font: 600 12px/1 var(--f-testo); letter-spacing: .22em; text-transform: uppercase; color: #CDB68C; }
</style>
</head>
<body>
<!-- Pagina di servizio per scripts/render-borgo.mjs: l'immagine per le anteprime social. -->
<div class="og">
  <img src="/assets/img/borgo/hero-1-m.webp" alt="">
  <img src="/assets/img/borgo/hero-2-m.webp" alt="">
  <img src="/assets/img/borgo/hero-3-m.webp" alt="">
  <div class="testo"><p class="luogo">Mosciano Sant'Angelo — Abruzzo</p><h1>Borgo <i>Spoltino</i></h1></div>
  <p class="firma">Anteprima · Prisma Locale</p>
</div>
<script type="module">
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode()));
  window.__pronto = true;
</script>
</body>
</html>
