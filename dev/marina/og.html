<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Vecchia Marina, immagine social</title>
<!-- Pagina di servizio per scripts/render-marina.mjs: l'immagine Open Graph
     (1200×630) dell'anteprima, fotografata con Playwright. -->
<style>
  @font-face { font-family: "Spectral"; src: url("/assets/fonts/spectral-200.woff2") format("woff2"); font-weight: 200; }
  @font-face { font-family: "Spectral"; src: url("/assets/fonts/spectral-200-italic.woff2") format("woff2"); font-weight: 200; font-style: italic; }
  @font-face { font-family: "Archivo"; src: url("/assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0C1A22; color: #F2EFE8; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
  .velo { position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(12 26 34 / .5), transparent 40%, rgb(12 26 34 / .55)); }
  .linea { position: absolute; left: 64px; right: 64px; top: 360px; height: 1px; background: #F2EFE8; opacity: .55; }
  h1, .rifl { position: absolute; left: 64px; margin: 0; font: 200 168px/0.78 "Spectral"; letter-spacing: -0.045em; white-space: nowrap; }
  h1 { bottom: 272px; }
  .rifl { top: 362px; transform: scaleY(-1); opacity: .25; -webkit-mask-image: linear-gradient(to top, #000, transparent 80%); }
  em { font-style: italic; letter-spacing: -0.055em; }
  p { position: absolute; left: 64px; top: 56px; margin: 0; font: 560 13px/1.8 "Archivo"; font-stretch: 72%; letter-spacing: .26em; text-transform: uppercase; color: #C9D0CC; }
  .firma { top: auto; bottom: 48px; }
</style>
</head>
<body>
  <img src="/assets/img/marina/superficie-l.webp" alt="">
  <div class="velo"></div>
  <p>Ristorante di pesce<br>Roseto degli Abruzzi</p>
  <div class="linea"></div>
  <h1>Vecchia <em>Marina</em></h1>
  <div class="rifl">Vecchia <em>Marina</em></div>
  <p class="firma">Anteprima riservata · Prisma Locale</p>
  <script>
    Promise.all([document.fonts.ready, new Promise((r) => { const i = document.querySelector('img'); i.complete ? r() : i.onload = r; })])
      .then(() => { window.__pronto = true; });
  </script>
</body>
</html>
