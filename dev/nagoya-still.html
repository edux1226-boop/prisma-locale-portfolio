<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Nagoya, render statico</title>
<style>html, body { margin: 0; background: #0F1412; } #tela { position: fixed; left: 0; top: 0; }</style>
</head>
<body>
<!-- Pagina di servizio per scripts/render-nagoya.mjs: renderizza il nigiri
     finito con la stessa scena dell'anteprima. ?w=1600&h=1000&q=0.8&p=1 -->
<div id="tela"></div>
<script type="module">
  import { createNigiri } from '/src/anteprime/nagoya/nigiri.js';
  const q = new URLSearchParams(location.search);
  const tela = document.getElementById('tela');
  tela.style.width = `${q.get('w') || 1600}px`;
  tela.style.height = `${q.get('h') || 1000}px`;
  const scena = await createNigiri(tela, { grains: 1800, still: { time: 6, progress: Number(q.get('p') ?? 1) } });
  window.__still = scena.canvas.toDataURL('image/webp', Number(q.get('q') || 0.8));
</script>
</body>
</html>
