<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Nagoya, immagine social</title>
<style>
  @font-face { font-family: "Shippori Mincho B1"; src: url("/assets/fonts/shippori-mincho-b1-500.woff2") format("woff2"); font-weight: 500; }

  .og span { position: absolute; left: 0; top: 0; height: 2px; width: 1360px; background: #FF7A4D; transform-origin: 0 50%; transform: translate(0, 630px) rotate(-27.7deg); opacity: 0.8; }
</style>
</head>
