<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gargantua — Buco nero su Canvas 2D</title>
<style>
  :root { color-scheme: dark; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* Il canvas occupa l'intera viewport ed è l'unico elemento "visivo" */
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* Testo di stato: sottile, discreto, visibile solo durante la pausa */
  #hint {
    position: fixed;
    left: 50%;
    bottom: 8vh;
    transform: translate(-50%, 12px);
    margin: 0;
    padding: 10px 22px;
    max-width: min(90vw, 560px);
    font: 300 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-align: center;
    color: rgba(255, 228, 196, .82);
    text-shadow: 0 0 18px rgba(255, 150, 60, .35);
    border: 1px solid rgba(255, 190, 130, .16);
    border-radius: 999px;
    background: rgba(10, 6, 4, .35);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;           /* i clic passano sempre al canvas */
    transition: opacity .7s ease, transform .7s ease;
  }

  #hint.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (max-width: 520px) {
    #hint { font-size: 11px; letter-spacing: .1em; padding: 9px 14px; max-width: 94vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    #hint { transition: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<p id="hint">Animazione sospesa · Clicca per riprendere l'espansione</p>

<script>
(() => {
  'use strict';

  /* =====================================================================
     GARGANTUA — buco nero in Canvas 2D nativo (nessuna libreria esterna)
     ---------------------------------------------------------------------
     Modello di rendering, dal fondo verso l'osservatore:
       1. campo stellare, deformato dalla lente gravitazionale
       2. metà POSTERIORE del disco, piegata dalla luce in due archi
          (uno sopra e uno sotto l'ombra) -> disegnata PRIMA
       3. orizzonte degli eventi: disco di nero assoluto
       4. alone di lensing + anello di fotoni
       5. metà ANTERIORE del disco -> disegnata DOPO, passa davanti al nero
       6. vignettatura
     ===================================================================== */

  const canvas = document.getElementById('scene');
  const ctx    = canvas.getContext('2d', { alpha: false });
  const hint   = document.getElementById('hint');

  /* ------------------------------------------------------------------
     Costanti di regia
     ------------------------------------------------------------------ */
  const PHASE_SECONDS = 10;      // durata ESATTA di ogni ciclo di espansione
  const FLATTEN       = 0.22;    // schiacciamento prospettico: vista quasi di taglio
  const R_START       = 0.045;   // raggio iniziale, in frazione del lato minore
  const R_MAX         = 0.30;    // raggio massimo raggiungibile
  const GROW_PER_SEC  = (R_MAX - R_START) / 24;  // ~2,4 cicli per arrivare al massimo
  const PHOTON_RING   = 1.34;    // anello di fotoni, in unità di R
  const DISK_INNER    = 1.5;     // bordo interno del disco, in unità di R
  const DISK_OUTER    = 4.7;     // bordo esterno del disco, in unità di R
  const IDLE_SPEED    = 0.05;    // velocità residua durante la stasi (5%)

  /* ------------------------------------------------------------------
     Stato globale
     ------------------------------------------------------------------ */
  let W = 0, H = 0, DPR = 1;     // dimensioni in pixel CSS e device pixel ratio
  let cx = 0, cy = 0, minDim = 0;

  let radiusFrac = R_START;      // raggio memorizzato come frazione -> resize gratis
  let phaseTime  = 0;            // secondi di espansione accumulati nel ciclo
  let paused     = false;
  let speed      = 1;            // moltiplicatore di velocità, interpolato dolcemente

  let particles = [];
  let stars     = [];
  let sprites   = [];

  /* ------------------------------------------------------------------
     Palette del disco: dal bianco incandescente interno
     al rosso cupo delle regioni esterne
     ------------------------------------------------------------------ */
  const PALETTE = [
    [255, 252, 238],  // bianco caldo  (bordo interno, gas più veloce)
    [255, 238, 196],
    [255, 210, 130],
    [255, 172,  74],
    [255, 128,  36],
    [232,  84,  18],
    [186,  48,  12],
    [126,  26,   8]   // rosso profondo (bordo esterno)
  ];

  /* Pre-renderizza uno sprite luminoso per ogni colore: disegnare
     un'immagine in cache è molto più veloce di migliaia di arc()+fill(). */
  function buildSprites() {
    sprites = PALETTE.map(([r, g, b]) => {
      const size = 32;
      const off  = document.createElement('canvas');
      off.width = off.height = size;
      const c = off.getContext('2d');
      const grd = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grd.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
      grd.addColorStop(0.28, `rgba(${r},${g},${b},0.55)`);
      grd.addColorStop(0.65, `rgba(${r},${g},${b},0.12)`);
      grd.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
      c.fillStyle = grd;
      c.fillRect(0, 0, size, size);
      return off;
    });
  }

  /* ------------------------------------------------------------------
     Popolamento del disco di accrescimento
     Ogni particella vive in coordinate NORMALIZZATE (multipli di R):
     così tutto il disco cresce insieme al buco nero.
     ------------------------------------------------------------------ */
  function buildParticles() {
    const target = Math.round(Math.min(7000, Math.max(2800, (W * H) / 210)));
    particles = new Array(target);

    for (let i = 0; i < target; i++) {
      // distribuzione addensata verso l'interno (pow < 1 schiaccia verso DISK_INNER)
      const t  = Math.pow(Math.random(), 1.7);
      const rn = DISK_INNER + (DISK_OUTER - DISK_INNER) * t;

      // temperatura: più vicino = più caldo = indice di palette più basso
      const heat = (rn - DISK_INNER) / (DISK_OUTER - DISK_INNER);
      let ci = Math.floor(heat * (PALETTE.length - 1) + (Math.random() - 0.5) * 1.6);
      ci = Math.max(0, Math.min(PALETTE.length - 1, ci));

      particles[i] = {
        rn,
        a: Math.random() * Math.PI * 2,                 // anomalia orbitale
        w: 1.55 / Math.pow(rn, 1.5),                    // velocità kepleriana: w ∝ r^-3/2
        h: (Math.random() - 0.5) * (0.10 + heat * 0.22), // spessore verticale del disco
        size: 0.5 + Math.random() * 1.5,
        alpha: 0.20 + Math.random() * 0.55,
        ci
      };
    }
  }

  /* Campo stellare in coordinate normalizzate [0,1]: sopravvive al resize. */
  function buildStars() {
    const target = Math.round(Math.min(1100, Math.max(350, (W * H) / 2200)));
    stars = new Array(target);
    for (let i = 0; i < target; i++) {
      stars[i] = {
        x: Math.random(),
        y: Math.random(),
        r: 0.25 + Math.random() * 1.15,
        a: 0.25 + Math.random() * 0.75,
        tw: Math.random() * Math.PI * 2,                // fase dello scintillio
        ts: 0.4 + Math.random() * 1.6                   // velocità dello scintillio
      };
    }
  }

  /* ------------------------------------------------------------------
     Dimensionamento responsivo (con gestione del device pixel ratio)
     ------------------------------------------------------------------ */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);   // cap a 2x per le performance
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);            // si lavora in pixel CSS

    cx = W / 2;
    cy = H / 2;
    minDim = Math.min(W, H);

    buildStars();
    if (!particles.length || Math.abs(particles.length - (W * H) / 210) > 2500) {
      buildParticles();
    }
  }

  /* ------------------------------------------------------------------
     Lente gravitazionale applicata alle stelle di sfondo.
     Deflessione radiale verso l'esterno: d' = d + k·R²/d
     Effetto collaterale (corretto): nessuna stella entro ~2R -> "ombra".
     ------------------------------------------------------------------ */
  function drawStars(R, time) {
    const k = R * R * 1.15;
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < stars.length; i++) {
      const s  = stars[i];
      const sx = s.x * W;
      const sy = s.y * H;
      const dx = sx - cx;
      const dy = sy - cy;
      const d  = Math.hypot(dx, dy) || 0.001;

      const dd = d + k / d;                  // posizione apparente, spinta verso l'esterno
      const px = cx + (dx / d) * dd;
      const py = cy + (dy / d) * dd;

      if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;

      // scintillio + leggero amplificarsi della luce vicino all'anello
      const twinkle = 0.72 + 0.28 * Math.sin(time * s.ts + s.tw);
      const boost   = 1 + Math.min(1.6, (R * 1.4) / d);

      ctx.globalAlpha = Math.min(1, s.a * twinkle * boost * 0.55);
      ctx.fillStyle = '#dfe9ff';
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ------------------------------------------------------------------
     Disegno del disco.
     `half`  = -1 -> metà posteriore (dietro al buco nero)
     `half`  = +1 -> metà anteriore  (davanti al buco nero)
     `mirror`= true -> secondo arco lensato, ribaltato sotto l'ombra
     ------------------------------------------------------------------ */
  function drawDisk(R, half, mirror) {
    const Rp     = R * PHOTON_RING;
    const scale  = Math.max(0.6, Math.min(2.4, R / (0.10 * minDim)));
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++) {
      const p   = particles[i];
      const sin = Math.sin(p.a);

      // selezione dell'emisfero: sin > 0 = lato vicino (davanti), sin < 0 = lato lontano
      if (half > 0 ? sin <= 0 : sin > 0) continue;

      const cos = Math.cos(p.a);
      const r   = p.rn * R;
      const x   = cx + r * cos;

      // offset verticale del disco appiattito (+ spessore)
      let dy = r * sin * FLATTEN + p.h * R;
      let alpha = p.alpha;

      if (half < 0) {
        /* Lensing gravitazionale: la luce del lato lontano scavalca l'ombra.
           Si fonde l'offset piatto con l'altezza minima necessaria a superare
           l'anello di fotoni; l'ipotenusa garantisce una curva morbida. */
        const dxc       = x - cx;
        const clearance = Math.sqrt(Math.max(0, Rp * Rp - dxc * dxc));
        const lifted    = Math.hypot(dy, clearance);

        if (mirror) {
          // secondo arco: visibile solo dove la deflessione è forte (sotto l'ombra)
          dy = lifted;
          alpha *= 0.55 * (clearance / Rp);
          if (alpha < 0.01) continue;
        } else {
          dy = -lifted;          // arco principale, sopra l'ombra
        }
      }

      const y = cy + dy;
      if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;

      /* Beaming relativistico: il gas che si avvicina all'osservatore
         (cos > 0) è nettamente più luminoso. È l'asimmetria tipica di
         Gargantua: un lato del disco brucia, l'altro è smorzato. */
      const beaming = 0.42 + 0.58 * (cos * 0.5 + 0.5);
      const near    = 1 + 0.5 * Math.max(0, 1 - (p.rn - DISK_INNER) / 1.2);

      ctx.globalAlpha = Math.min(1, alpha * beaming * near);
      const s = p.size * scale * (2.6 + beaming);
      ctx.drawImage(sprites[p.ci], x - s / 2, y - s / 2, s, s);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* Orizzonte degli eventi: nero assoluto, opaco, occlude tutto ciò che sta dietro. */
  function drawEventHorizon(R) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Alone di lensing + anello di fotoni, in blending additivo. */
  function drawHalo(R) {
    ctx.globalCompositeOperation = 'lighter';

    // alone sfumato: parte esattamente dal bordo dell'orizzonte
    const glow = ctx.createRadialGradient(cx, cy, R * 0.99, cx, cy, R * 3.1);
    glow.addColorStop(0.00, 'rgba(255, 196, 120, 0.38)');
    glow.addColorStop(0.08, 'rgba(255, 158,  72, 0.22)');
    glow.addColorStop(0.32, 'rgba(255, 120,  40, 0.09)');
    glow.addColorStop(0.70, 'rgba(180,  70,  25, 0.03)');
    glow.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;

    /* Il riempimento deve essere una CORONA, non un cerchio pieno: dentro il
       raggio interno il gradiente propaga lo stop 0 e, in blending additivo,
       schiarirebbe l'orizzonte degli eventi. L'arco interno percorso in senso
       antiorario buca il path e tiene il centro perfettamente nero. */
    ctx.beginPath();
    ctx.arc(cx, cy, R * 3.1, 0, Math.PI * 2, false);
    ctx.arc(cx, cy, R, 0, Math.PI * 2, true);
    ctx.fill();

    // anello di fotoni: la sottile lama di luce che orla l'ombra
    ctx.strokeStyle = 'rgba(255, 226, 178, 0.55)';
    ctx.lineWidth = Math.max(1, R * 0.018);
    ctx.beginPath();
    ctx.arc(cx, cy, R * PHOTON_RING, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 170, 90, 0.20)';
    ctx.lineWidth = Math.max(1.5, R * 0.06);
    ctx.beginPath();
    ctx.arc(cx, cy, R * (PHOTON_RING + 0.03), 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';
  }

  /* Sfondo di spazio profondo: nero bluastro con una nebulosa appena accennata. */
  function drawBackground() {
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);

    const neb = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
    neb.addColorStop(0, 'rgba(24, 20, 44, 0.55)');
    neb.addColorStop(1, 'rgba(2, 3, 8, 0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);
  }

  /* Vignettatura finale: chiude i bordi e concentra lo sguardo al centro. */
  function drawVignette() {
    const v = ctx.createRadialGradient(cx, cy, minDim * 0.25, cx, cy, Math.max(W, H) * 0.78);
    v.addColorStop(0, 'rgba(0, 0, 0, 0)');
    v.addColorStop(1, 'rgba(0, 0, 0, 0.72)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  /* ------------------------------------------------------------------
     Ciclo di animazione
     ------------------------------------------------------------------ */
  let lastTime = 0;
  let clock    = 0;   // tempo "scenico", scalato dalla velocità corrente

  function frame(now) {
    // dt in secondi, con clamp: evita salti dopo un cambio di scheda
    const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 0.016;
    lastTime = now;

    // interpolazione dolce della velocità tra moto pieno e stasi
    const targetSpeed = paused ? IDLE_SPEED : 1;
    speed += (targetSpeed - speed) * Math.min(1, dt * 2.2);
    clock += dt * speed;

    if (!paused) {
      phaseTime += dt;

      // espansione progressiva dell'orizzonte degli eventi
      radiusFrac = Math.min(R_MAX, radiusFrac + GROW_PER_SEC * dt);

      // ...fermata esattamente al decimo secondo
      if (phaseTime >= PHASE_SECONDS) {
        phaseTime = PHASE_SECONDS;
        paused = true;
        hint.classList.add('is-visible');
      }
    }

    // avanzamento orbitale (rallenta insieme a `speed` durante la stasi)
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.a += p.w * speed * dt;
      if (p.a > Math.PI * 2) p.a -= Math.PI * 2;
    }

    const R = radiusFrac * minDim;

    // --- pipeline di disegno: dal fondo verso l'osservatore ---
    drawBackground();
    drawStars(R, clock);
    drawDisk(R, -1, true);        // arco lensato inferiore (dietro)
    drawDisk(R, -1, false);       // metà posteriore, lensata sopra l'ombra (dietro)
    drawEventHorizon(R);          // nero assoluto: occlude tutto ciò che precede
    drawHalo(R);                  // alone gravitazionale + anello di fotoni
    drawDisk(R, +1, false);       // metà anteriore: passa DAVANTI al buco nero
    drawVignette();

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------
     Interazione: un clic del mouse riavvia l'espansione per altri 10s
     (nessuna scorciatoia da tastiera, come richiesto)
     ------------------------------------------------------------------ */
  function resume() {
    if (!paused) return;
    paused = false;
    phaseTime = 0;
    hint.classList.remove('is-visible');
  }

  canvas.addEventListener('pointerdown', resume);   // copre mouse, penna e touch
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // --- avvio ---
  buildSprites();
  resize();
  buildParticles();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
