<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gargantua — Buco nero su Canvas 2D</title>
<style>
  :root { color-scheme: dark; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* Il canvas occupa l'intera viewport */
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* Strato di interfaccia: non intercetta mai i clic, che vanno al canvas */
  #ui {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    padding: 0 16px 7vh;
    pointer-events: none;
    font: 300 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    text-align: center;
  }

  /* --- Pannello del countdown --- */
  #timer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 34px;
    border: 1px solid rgba(255, 190, 130, .18);
    border-radius: 18px;
    background: rgba(10, 6, 4, .42);
    backdrop-filter: blur(4px);
    opacity: 0;
    transform: translateY(14px) scale(.96);
    transition: opacity .45s ease, transform .45s ease, border-color .3s ease;
  }

  #timer.is-visible { opacity: 1; transform: translateY(0) scale(1); }

  #count {
    font-size: clamp(38px, 7vw, 62px);
    font-weight: 200;
    line-height: 1;
    letter-spacing: .03em;
    font-variant-numeric: tabular-nums;   /* le cifre non ballano mentre scorrono */
    color: rgba(255, 234, 208, .95);
    text-shadow: 0 0 26px rgba(255, 150, 60, .45);
  }

  #timerLabel {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255, 214, 178, .58);
  }

  /* Ultimi 3 secondi: il pannello vira al rosso e pulsa */
  #timer.is-urgent { border-color: rgba(255, 90, 60, .45); }
  #timer.is-urgent #count {
    color: #ff9d72;
    text-shadow: 0 0 34px rgba(255, 70, 30, .7);
    animation: pulse .9s ease-in-out infinite;
  }

  /* Timer congelato con [0]: tutto si smorza e resta immobile */
  #timer.is-frozen #count {
    color: rgba(170, 200, 255, .8);
    text-shadow: 0 0 26px rgba(90, 140, 255, .4);
    animation: none;
  }
  #timer.is-frozen { border-color: rgba(140, 180, 255, .3); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .45; }
  }

  /* --- Riga di suggerimento --- */
  #hint {
    margin: 0;
    max-width: min(92vw, 620px);
    padding: 9px 20px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255, 228, 196, .8);
    text-shadow: 0 0 18px rgba(255, 150, 60, .35);
    border: 1px solid rgba(255, 190, 130, .14);
    border-radius: 999px;
    background: rgba(10, 6, 4, .32);
    backdrop-filter: blur(3px);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease;
  }

  #hint.is-visible { opacity: 1; transform: translateY(0); }

  /* Stato finale: la pagina è stata divorata, resta solo l'invito a ripartire */
  #hint.is-devoured {
    border-color: rgba(255, 255, 255, .22);
    color: rgba(255, 255, 255, .88);
    text-shadow: 0 0 22px rgba(255, 255, 255, .25);
  }

  kbd {
    display: inline-block;
    min-width: 1.6em;
    margin: 0 .15em;
    padding: 1px 6px;
    font: inherit;
    font-weight: 500;
    letter-spacing: .08em;
    color: rgba(255, 244, 228, .95);
    border: 1px solid rgba(255, 200, 150, .32);
    border-radius: 5px;
    background: rgba(255, 180, 120, .1);
  }

  @media (max-width: 520px) {
    #ui { padding-bottom: 5vh; gap: 14px; }
    #hint { font-size: 11px; letter-spacing: .1em; padding: 8px 14px; }
    #timer { padding: 14px 24px; }
    #timerLabel { letter-spacing: .12em; }
  }

  @media (prefers-reduced-motion: reduce) {
    #timer, #hint { transition: none; }
    #timer.is-urgent #count { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="ui">
  <div id="timer">
    <span id="count">10.0</span>
    <span id="timerLabel">secondi al collasso</span>
  </div>
  <p id="hint"></p>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     GARGANTUA — buco nero in Canvas 2D nativo (nessuna libreria esterna)
     ---------------------------------------------------------------------
     RENDERING, dal fondo verso l'osservatore:
       1. campo stellare, deformato dalla lente gravitazionale
       2. metà POSTERIORE del disco, piegata in due archi -> disegnata PRIMA
       3. orizzonte degli eventi: disco di nero assoluto
       4. alone di lensing + anello di fotoni
       5. metà ANTERIORE del disco -> disegnata DOPO, passa davanti al nero
       6. vignettatura

     MACCHINA A STATI:
       RUNNING  --[SPAZIO]--> STOPPED
       STOPPED  --[SPAZIO]--> RUNNING          (riavvio)
       STOPPED  --[0]-------> countdown congelato (toggle)
       STOPPED  --[countdown a 0]--> RUNAWAY   (espansione infinita)
       RUNAWAY  --[schermo divorato]--> DEVOURED
       *        --[R]-------> RUNNING          (reset totale)
     ===================================================================== */

  const canvas = document.getElementById('scene');
  const ctx    = canvas.getContext('2d', { alpha: false });
  const ui = {
    timer: document.getElementById('timer'),
    count: document.getElementById('count'),
    label: document.getElementById('timerLabel'),
    hint:  document.getElementById('hint')
  };

  /* ------------------------------------------------------------------
     Costanti di regia
     ------------------------------------------------------------------ */
  const COUNTDOWN     = 10;      // secondi del timer che compare con SPAZIO
  const FLATTEN       = 0.22;    // schiacciamento prospettico: vista quasi di taglio
  const R_START       = 0.045;   // raggio iniziale, in frazione del lato minore
  const R_MAX         = 0.30;    // tetto del raggio durante l'espansione normale
  const GROW_PER_SEC  = (R_MAX - R_START) / 24;
  const RUNAWAY_RATE  = 0.42;    // costante di crescita esponenziale del collasso
  const PHOTON_RING   = 1.34;    // anello di fotoni, in unità di R
  const DISK_INNER    = 1.5;     // bordo interno del disco, in unità di R
  const DISK_OUTER    = 4.7;     // bordo esterno del disco, in unità di R
  const IDLE_SPEED    = 0.05;    // velocità residua durante la stasi (5%)
  const HINT_TIMEOUT  = 4;       // secondi di visibilità del suggerimento iniziale

  const STATE = {
    RUNNING:  'running',
    STOPPED:  'stopped',
    RUNAWAY:  'runaway',
    DEVOURED: 'devoured'
  };

  /* ------------------------------------------------------------------
     Stato globale
     ------------------------------------------------------------------ */
  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0, minDim = 0, coverFrac = 1;  // coverFrac: raggio che copre lo schermo

  let state       = STATE.RUNNING;
  let radiusFrac  = R_START;     // raggio come frazione -> il resize è gratuito
  let countdown   = COUNTDOWN;
  let timerFrozen = false;
  let speed       = 1;           // moltiplicatore di velocità, interpolato dolcemente
  let hintTimer   = 0;           // secondi residui del suggerimento a scomparsa
  let devourFade  = 1;           // 1 = disco visibile, 0 = inghiottito dall'ombra

  let particles = [];
  let stars     = [];
  let sprites   = [];

  /* ------------------------------------------------------------------
     Palette del disco: dal bianco incandescente interno
     al rosso cupo delle regioni esterne
     ------------------------------------------------------------------ */
  const PALETTE = [
    [255, 252, 238],  // bianco caldo  (bordo interno, gas più veloce)
    [255, 238, 196],
    [255, 210, 130],
    [255, 172,  74],
    [255, 128,  36],
    [232,  84,  18],
    [186,  48,  12],
    [126,  26,   8]   // rosso profondo (bordo esterno)
  ];

  /* Pre-renderizza uno sprite luminoso per ogni colore: disegnare
     un'immagine in cache è molto più veloce di migliaia di arc()+fill(). */
  function buildSprites() {
    sprites = PALETTE.map(([r, g, b]) => {
      const size = 32;
      const off  = document.createElement('canvas');
      off.width = off.height = size;
      const c = off.getContext('2d');
      const grd = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grd.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
      grd.addColorStop(0.28, `rgba(${r},${g},${b},0.55)`);
      grd.addColorStop(0.65, `rgba(${r},${g},${b},0.12)`);
      grd.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
      c.fillStyle = grd;
      c.fillRect(0, 0, size, size);
      return off;
    });
  }

  /* ------------------------------------------------------------------
     Popolamento del disco di accrescimento
     Ogni particella vive in coordinate NORMALIZZATE (multipli di R):
     così tutto il disco cresce insieme al buco nero.
     ------------------------------------------------------------------ */
  function buildParticles() {
    const target = Math.round(Math.min(7000, Math.max(2800, (W * H) / 210)));
    particles = new Array(target);

    for (let i = 0; i < target; i++) {
      // distribuzione addensata verso l'interno
      const t  = Math.pow(Math.random(), 1.7);
      const rn = DISK_INNER + (DISK_OUTER - DISK_INNER) * t;

      // temperatura: più vicino = più caldo = indice di palette più basso
      const heat = (rn - DISK_INNER) / (DISK_OUTER - DISK_INNER);
      let ci = Math.floor(heat * (PALETTE.length - 1) + (Math.random() - 0.5) * 1.6);
      ci = Math.max(0, Math.min(PALETTE.length - 1, ci));

      particles[i] = {
        rn,
        a: Math.random() * Math.PI * 2,                 // anomalia orbitale
        w: 1.55 / Math.pow(rn, 1.5),                    // velocità kepleriana: w ∝ r^-3/2
        h: (Math.random() - 0.5) * (0.10 + heat * 0.22), // spessore verticale del disco
        size: 0.5 + Math.random() * 1.5,
        alpha: 0.20 + Math.random() * 0.55,
        ci
      };
    }
  }

  /* Campo stellare in coordinate normalizzate [0,1]: sopravvive al resize. */
  function buildStars() {
    const target = Math.round(Math.min(1100, Math.max(350, (W * H) / 2200)));
    stars = new Array(target);
    for (let i = 0; i < target; i++) {
      stars[i] = {
        x: Math.random(),
        y: Math.random(),
        r: 0.25 + Math.random() * 1.15,
        a: 0.25 + Math.random() * 0.75,
        tw: Math.random() * Math.PI * 2,                // fase dello scintillio
        ts: 0.4 + Math.random() * 1.6                   // velocità dello scintillio
      };
    }
  }

  /* ------------------------------------------------------------------
     Dimensionamento responsivo (con gestione del device pixel ratio)
     ------------------------------------------------------------------ */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);   // cap a 2x per le performance
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);            // si lavora in pixel CSS

    cx = W / 2;
    cy = H / 2;
    minDim = Math.min(W, H);

    // raggio (in frazioni) necessario a coprire l'angolo più lontano dello schermo
    coverFrac = Math.hypot(W, H) / 2 / minDim;

    buildStars();
    if (!particles.length || Math.abs(particles.length - (W * H) / 210) > 2500) {
      buildParticles();
    }
  }

  /* ------------------------------------------------------------------
     Lente gravitazionale applicata alle stelle di sfondo.
     Deflessione radiale verso l'esterno: d' = d + k·R²/d
     Effetto collaterale (corretto): nessuna stella entro ~2R -> "ombra".
     ------------------------------------------------------------------ */
  function drawStars(R, time) {
    const k = R * R * 1.15;
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < stars.length; i++) {
      const s  = stars[i];
      const dx = s.x * W - cx;
      const dy = s.y * H - cy;
      const d  = Math.hypot(dx, dy) || 0.001;

      const dd = d + k / d;                  // posizione apparente, spinta verso l'esterno
      const px = cx + (dx / d) * dd;
      const py = cy + (dy / d) * dd;

      if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;

      // scintillio + leggero amplificarsi della luce vicino all'anello
      const twinkle = 0.72 + 0.28 * Math.sin(time * s.ts + s.tw);
      const boost   = 1 + Math.min(1.6, (R * 1.4) / d);

      ctx.globalAlpha = Math.min(1, s.a * twinkle * boost * 0.55);
      ctx.fillStyle = '#dfe9ff';
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ------------------------------------------------------------------
     Disegno del disco.
     `half`  = -1 -> metà posteriore (dietro al buco nero)
     `half`  = +1 -> metà anteriore  (davanti al buco nero)
     `mirror`= true -> secondo arco lensato, ribaltato sotto l'ombra
     ------------------------------------------------------------------ */
  function drawDisk(R, half, mirror) {
    if (devourFade <= 0) return;          // interamente oltre l'orizzonte: niente da disegnare
    const Rp    = R * PHOTON_RING;
    const scale = Math.max(0.6, Math.min(2.4, R / (0.10 * minDim)));
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++) {
      const p   = particles[i];
      const sin = Math.sin(p.a);

      // selezione dell'emisfero: sin > 0 = lato vicino (davanti), sin < 0 = lato lontano
      if (half > 0 ? sin <= 0 : sin > 0) continue;

      const cos = Math.cos(p.a);
      const r   = p.rn * R;
      const x   = cx + r * cos;

      // offset verticale del disco appiattito (+ spessore)
      let dy = r * sin * FLATTEN + p.h * R;
      let alpha = p.alpha;

      if (half < 0) {
        /* Lensing gravitazionale: la luce del lato lontano scavalca l'ombra.
           Si fonde l'offset piatto con l'altezza minima necessaria a superare
           l'anello di fotoni; l'ipotenusa garantisce una curva morbida. */
        const dxc       = x - cx;
        const clearance = Math.sqrt(Math.max(0, Rp * Rp - dxc * dxc));
        const lifted    = Math.hypot(dy, clearance);

        if (mirror) {
          // secondo arco: visibile solo dove la deflessione è forte (sotto l'ombra)
          dy = lifted;
          alpha *= 0.55 * (clearance / Rp);
          if (alpha < 0.01) continue;
        } else {
          dy = -lifted;          // arco principale, sopra l'ombra
        }
      }

      const y = cy + dy;
      if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;

      /* Beaming relativistico: il gas che si avvicina all'osservatore
         (cos > 0) è nettamente più luminoso. È l'asimmetria tipica di
         Gargantua: un lato del disco brucia, l'altro è smorzato. */
      const beaming = 0.42 + 0.58 * (cos * 0.5 + 0.5);
      const near    = 1 + 0.5 * Math.max(0, 1 - (p.rn - DISK_INNER) / 1.2);

      ctx.globalAlpha = Math.min(1, alpha * beaming * near) * devourFade;
      const s = p.size * scale * (2.6 + beaming);
      ctx.drawImage(sprites[p.ci], x - s / 2, y - s / 2, s, s);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* Orizzonte degli eventi: nero assoluto, opaco, occlude tutto ciò che sta dietro. */
  function drawEventHorizon(R) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  /* Alone di lensing + anello di fotoni, in blending additivo. */
  function drawHalo(R) {
    if (devourFade <= 0) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = devourFade;

    // alone sfumato: parte esattamente dal bordo dell'orizzonte
    const glow = ctx.createRadialGradient(cx, cy, R * 0.99, cx, cy, R * 3.1);
    glow.addColorStop(0.00, 'rgba(255, 196, 120, 0.38)');
    glow.addColorStop(0.08, 'rgba(255, 158,  72, 0.22)');
    glow.addColorStop(0.32, 'rgba(255, 120,  40, 0.09)');
    glow.addColorStop(0.70, 'rgba(180,  70,  25, 0.03)');
    glow.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;

    /* Il riempimento deve essere una CORONA, non un cerchio pieno: dentro il
       raggio interno il gradiente propaga lo stop 0 e, in blending additivo,
       schiarirebbe l'orizzonte degli eventi. L'arco interno percorso in senso
       antiorario buca il path e tiene il centro perfettamente nero. */
    ctx.beginPath();
    ctx.arc(cx, cy, R * 3.1, 0, Math.PI * 2, false);
    ctx.arc(cx, cy, R, 0, Math.PI * 2, true);
    ctx.fill();

    // anello di fotoni: la sottile lama di luce che orla l'ombra
    ctx.strokeStyle = 'rgba(255, 226, 178, 0.55)';
    ctx.lineWidth = Math.max(1, R * 0.018);
    ctx.beginPath();
    ctx.arc(cx, cy, R * PHOTON_RING, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 170, 90, 0.20)';
    ctx.lineWidth = Math.max(1.5, R * 0.06);
    ctx.beginPath();
    ctx.arc(cx, cy, R * (PHOTON_RING + 0.03), 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* Sfondo di spazio profondo: nero bluastro con una nebulosa appena accennata. */
  function drawBackground() {
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);

    const neb = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
    neb.addColorStop(0, 'rgba(24, 20, 44, 0.55)');
    neb.addColorStop(1, 'rgba(2, 3, 8, 0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);
  }

  /* Vignettatura finale: chiude i bordi e concentra lo sguardo al centro. */
  function drawVignette() {
    const v = ctx.createRadialGradient(cx, cy, minDim * 0.25, cx, cy, Math.max(W, H) * 0.78);
    v.addColorStop(0, 'rgba(0, 0, 0, 0)');
    v.addColorStop(1, 'rgba(0, 0, 0, 0.72)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  /* =====================================================================
     INTERFACCIA
     ===================================================================== */

  function showHint(html, devoured) {
    ui.hint.innerHTML = html;
    ui.hint.classList.toggle('is-devoured', !!devoured);
    ui.hint.classList.add('is-visible');
  }

  function hideHint() {
    ui.hint.classList.remove('is-visible');
  }

  /* Sincronizza i pannelli con lo stato corrente. */
  function syncUI() {
    const stopped = (state === STATE.STOPPED);
    ui.timer.classList.toggle('is-visible', stopped);
    ui.timer.classList.toggle('is-frozen', stopped && timerFrozen);
    ui.timer.classList.toggle('is-urgent', stopped && !timerFrozen && countdown <= 3);

    if (stopped) {
      ui.count.textContent = Math.max(0, countdown).toFixed(1);
      ui.label.textContent = timerFrozen ? 'conto alla rovescia bloccato' : 'secondi al collasso';
    }

    switch (state) {
      case STATE.STOPPED:
        showHint(timerFrozen
          ? '<kbd>0</kbd> riprende il conteggio · <kbd>spazio</kbd> riavvia l\'espansione'
          : '<kbd>spazio</kbd> riavvia · <kbd>0</kbd> blocca il timer');
        break;

      case STATE.RUNAWAY:
        showHint('Espansione fuori controllo');
        break;

      case STATE.DEVOURED:
        showHint('Pagina divorata · premi <kbd>R</kbd> per far ripartire tutto', true);
        break;

      case STATE.RUNNING:
        // suggerimento iniziale, a scomparsa automatica
        if (hintTimer > 0) showHint('<kbd>spazio</kbd> per fermare l\'espansione');
        else hideHint();
        break;
    }
  }

  /* =====================================================================
     TRANSIZIONI DI STATO
     ===================================================================== */

  /* SPAZIO (o clic): ferma l'espansione e avvia il countdown, oppure riavvia. */
  function toggleStop() {
    if (state === STATE.RUNNING) {
      state = STATE.STOPPED;
      countdown = COUNTDOWN;
      timerFrozen = false;
    } else if (state === STATE.STOPPED) {
      state = STATE.RUNNING;
      hintTimer = HINT_TIMEOUT;
    } else {
      return;   // durante RUNAWAY e DEVOURED non si torna indietro: resta solo R
    }
    syncUI();
  }

  /* 0: congela / scongela il conto alla rovescia, senza riavviare l'espansione. */
  function toggleFreeze() {
    if (state !== STATE.STOPPED) return;
    timerFrozen = !timerFrozen;
    syncUI();
  }

  /* R: reset totale, da qualunque stato. */
  function reset() {
    state = STATE.RUNNING;
    radiusFrac = R_START;
    countdown = COUNTDOWN;
    timerFrozen = false;
    speed = 1;
    devourFade = 1;
    hintTimer = HINT_TIMEOUT;
    buildParticles();     // nuova estrazione casuale: il disco non si ripete mai uguale
    buildStars();
    syncUI();
  }

  /* =====================================================================
     CICLO DI ANIMAZIONE
     ===================================================================== */
  let lastTime = 0;
  let clock    = 0;   // tempo "scenico", scalato dalla velocità corrente

  function frame(now) {
    // dt in secondi, con clamp: evita salti dopo un cambio di scheda
    const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 0.016;
    lastTime = now;

    let targetSpeed = 1;

    switch (state) {
      case STATE.RUNNING:
        // espansione progressiva, con tetto a R_MAX
        radiusFrac = Math.min(R_MAX, radiusFrac + GROW_PER_SEC * dt);

        // il suggerimento iniziale svanisce da solo
        if (hintTimer > 0) {
          hintTimer -= dt;
          if (hintTimer <= 0) { hintTimer = 0; hideHint(); }
        }
        break;

      case STATE.STOPPED:
        targetSpeed = IDLE_SPEED;        // le particelle rallentano quasi a fermarsi
        if (!timerFrozen) {
          countdown -= dt;
          if (countdown <= 0) {
            countdown = 0;
            state = STATE.RUNAWAY;       // nessuno è intervenuto: collasso
          }
        }
        syncUI();
        break;

      case STATE.RUNAWAY:
        /* Crescita esponenziale: dr/dt = k·r + c. Il termine additivo evita
           la stasi se r fosse piccolo, quello moltiplicativo dà l'accelerazione
           che fa "divorare" la pagina in un paio di secondi. */
        radiusFrac += (radiusFrac * RUNAWAY_RATE + 0.03) * dt;
        targetSpeed = 2.6;               // il gas precipita e vortica sempre più veloce
        if (radiusFrac >= coverFrac) {   // l'ombra ha raggiunto gli angoli dello schermo
          state = STATE.DEVOURED;
          syncUI();
        }
        break;

      case STATE.DEVOURED:
        targetSpeed = 0;
        break;
    }

    // interpolazione dolce della velocità: nessuno scatto nei cambi di stato
    speed += (targetSpeed - speed) * Math.min(1, dt * 2.2);
    clock += dt * speed;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.a += p.w * speed * dt;
      if (p.a > Math.PI * 2) p.a -= Math.PI * 2;
    }

    const R = radiusFrac * minDim;

    /* Dissolvenza di divoramento: negli ultimi 35% di crescita verso la
       copertura totale, disco e alone si spengono. Senza questo, la metà
       ANTERIORE del disco — disegnata dopo l'orizzonte — resterebbe visibile
       sopra il nero anche a schermo interamente coperto. */
    devourFade = Math.max(0, Math.min(1, (coverFrac - radiusFrac) / (coverFrac * 0.35)));

    // --- pipeline di disegno: dal fondo verso l'osservatore ---
    drawBackground();
    drawStars(R, clock);
    drawDisk(R, -1, true);        // arco lensato inferiore (dietro)
    drawDisk(R, -1, false);       // metà posteriore, lensata sopra l'ombra (dietro)
    drawEventHorizon(R);          // nero assoluto: occlude tutto ciò che precede
    drawHalo(R);                  // alone gravitazionale + anello di fotoni
    drawDisk(R, +1, false);       // metà anteriore: passa DAVANTI al buco nero
    drawVignette();

    requestAnimationFrame(frame);
  }

  /* =====================================================================
     INPUT
     ===================================================================== */
  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;

    switch (e.code) {
      case 'Space':
        e.preventDefault();               // niente scroll della pagina
        toggleStop();
        break;
      case 'Digit0':
      case 'Numpad0':
        toggleFreeze();
        break;
      case 'KeyR':
        reset();
        break;
    }
  });

  // Il clic è un alias di SPAZIO: comodo da touch, dove la tastiera non c'è
  canvas.addEventListener('pointerdown', toggleStop);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // --- avvio ---
  buildSprites();
  resize();
  buildParticles();
  hintTimer = HINT_TIMEOUT;
  syncUI();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
