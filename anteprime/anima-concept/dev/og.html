<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Anima, immagine social</title>
<style>
  @font-face { font-family: 'Fraunces Anima'; src: url('/assets/fonts/fraunces-soft.woff2') format('woff2'); font-weight: 300 800; }
  @font-face { font-family: 'Manrope'; src: url('/assets/fonts/manrope.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #140B06; }
  img { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .velo { position: absolute; inset: 0; background: linear-gradient(to right, rgb(20 11 6 / 0.9), rgb(20 11 6 / 0.4) 48%, rgb(20 11 6 / 0) 66%); }
  .testo { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; color: #FBF8F0; width: 560px; }
  .marchio { font-family: 'Fraunces Anima'; font-weight: 780; font-variation-settings: "SOFT" 100; font-size: 44px; letter-spacing: -0.02em; }
  h1 { margin: 22px 0 0; font-family: 'Fraunces Anima'; font-weight: 760; font-variation-settings: "SOFT" 100; font-size: 76px; line-height: 0.95; letter-spacing: -0.025em; }
  p { margin: 22px 0 0; font-family: 'Manrope'; font-weight: 600; font-size: 22px; color: #C9B79A; }
</style>
</head>
<body>
<!-- Pagina di servizio per anteprime/anima-concept/render.mjs (fondo renderizzato dalla scena 3D). -->
<img src="/anteprime/anima-concept/dev/og-fondo.png" alt="">
<div class="velo"></div>
<div class="testo">
  <div class="marchio">Anima</div>
  <h1>Ogni sera, più di una pizza.</h1>
  <p>Pizzeria a Roseto degli Abruzzi. Anteprima riservata.</p>
</div>
</body>
</html>
